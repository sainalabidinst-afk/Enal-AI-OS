[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enal-ai-sdk"
version = "0.1.0"
description = "Enal Cognitive Platform SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Enal Ai OS", email = "contact@enal.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.6.0",
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
]

[project.optional-deps]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/enal-ai-org/ecp"
Documentation = "https://docs.enal.ai"
Repository = "https://github.com/enal-ai-org/ecp"

[tool.setuptools.packages.find]
where = ["."]
include = ["sdk*"]
