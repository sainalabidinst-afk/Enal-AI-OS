# Kubernetes Deployment Manifest — Enal AI OS v3.1.0-rc1
# Registry: docker.io/chokyrasta
# Deploy dengan: kubectl apply -f k8s/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: enal-ai-os-backend
  namespace: enal-ai-os
  labels:
    app: enal-ai-os-backend
    version: v3.1.0-rc1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enal-ai-os-backend
  template:
    metadata:
      labels:
        app: enal-ai-os-backend
        version: v3.1.0-rc1
    spec:
      containers:
        - name: backend
          image: docker.io/chokyrasta/enal-ai-os-backend:3.1.0-rc1
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: enal-ai-os-secrets
                  key: secret-key
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: enal-ai-os-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://redis:6379"
            - name: QDRANT_URL
              value: "http://qdrant:6333"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: 2
              memory: 4Gi
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: enal-ai-os-frontend
  namespace: enal-ai-os
  labels:
    app: enal-ai-os-frontend
    version: v3.1.0-rc1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: enal-ai-os-frontend
  template:
    metadata:
      labels:
        app: enal-ai-os-frontend
        version: v3.1.0-rc1
    spec:
      containers:
        - name: frontend
          image: docker.io/chokyrasta/enal-ai-os-frontend:3.1.0-rc1
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://enal-ai-os-backend:8000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: enal-ai-os-backend
  namespace: enal-ai-os
spec:
  selector:
    app: enal-ai-os-backend
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: enal-ai-os-frontend
  namespace: enal-ai-os
spec:
  selector:
    app: enal-ai-os-frontend
  ports:
    - port: 3000
      targetPort: 3000
      name: http
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: enal-ai-os-ingress
  namespace: enal-ai-os
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: staging.enal-ai-os.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: enal-ai-os-frontend
                port:
                  number: 3000
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: enal-ai-os-backend
                port:
                  number: 8000
