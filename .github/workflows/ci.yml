name: ECP CI/CD Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run ruff
        run: ruff check backend/app/ benchmarks/ real_cases/ tests/
      - name: Run black
        run: black --check backend/app/ benchmarks/ real_cases/ tests/

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run mypy
        run: python -m mypy backend/app/core --ignore-missing-imports --explicit-package-bases

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # The full suite (backend/tests/ + tests/) takes ~15 min locally. GitHub's
    # implicit 6-hour job limit would let a hang burn that long; fail fast here.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest backend/tests/ tests/ -v

  architecture-test:
    name: Architecture Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run package boundary check
        run: python benchmarks/package_boundaries.py

  benchmarks:
    name: Benchmark Suite
    # System Architect and Full Stack benchmarks are deterministic and must always run.
    # Provider-backed work (performance_benchmark.py) is intentionally opt-in to avoid CI failures
    # when a protected API secret is absent.
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ${{ secrets.SECRET_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      DEFAULT_REASONING_MODEL: gemini/gemini-3.8-flash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run System Architect benchmarks
        run: python benchmarks/system_architect_benchmark.py
      - name: Run Full Stack Engineer benchmarks
        run: python benchmarks/full_stack_engineer_benchmark.py
      - name: Run Phase 5 benchmarks (Cloud Architect, SRE, Compliance, Knowledge)
        run: |
          python benchmarks/cloud_architect_benchmark.py
          python benchmarks/sre_engineer_benchmark.py
          python benchmarks/compliance_officer_benchmark.py
          python benchmarks/knowledge_engineer_benchmark.py
      - name: Run Phase 6 benchmarks (Finance Analyst, Legal Advisor, HSE Specialist)
        run: |
          python benchmarks/finance_analyst_benchmark.py
          python benchmarks/legal_advisor_benchmark.py
          python benchmarks/hse_specialist_benchmark.py
      - name: Run Phase 7+ benchmarks (Observability, Cybersecurity Analyst)
        run: |
          python benchmarks/observability_benchmark.py
          python benchmarks/cybersecurity_analyst_benchmark.py
      - name: Run Phase 7++ benchmarks (AI Ethics, Supply Chain, Data Scientist, BI, Innovation, DevSecOps)
        run: |
          python benchmarks/ai_ethics_pack_benchmark.py
          python benchmarks/supply_chain_analyst_benchmark.py
          python benchmarks/data_scientist_benchmark.py
          python benchmarks/business_intelligence_benchmark.py
          python benchmarks/innovation_strategist_benchmark.py
          python benchmarks/devsecops_benchmark.py
      - name: Run Document Processing benchmarks
        run: python benchmarks/document_processing_benchmark.py
      - name: Run Phase 8++ benchmarks (Translator Expert, Voice Interaction)
        run: |
          python benchmarks/translator_expert_benchmark.py
          python benchmarks/voice_interaction_benchmark.py
      - name: Run Pilar 4 Phase 3 benchmark
        run: python benchmarks/pilar4_phase3_benchmark.py
      - name: Upload Pilar 4 benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: pilar4-phase3-benchmark
          path: benchmarks/reports/pilar4_phase3_benchmark.json
      - name: Run provider-backed benchmarks (opt-in)
        if: ${{ vars.RUN_PROVIDER_BENCHMARK == 'true' }}
        run: python benchmarks/performance_benchmark.py

  benchmark-gate:
    name: Benchmark Gate
    needs: [benchmarks]
    if: always() && needs.benchmarks.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Benchmark gate passed
        run: echo "All system benchmarks passed"

  frontend-type-check:
    name: Frontend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: npm install --prefix frontend
      - name: Run TypeScript check
        run: npx tsc --noEmit --skipLibCheck
        working-directory: frontend

  sdk-compatibility:
    name: SDK Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install SDK
        run: pip install -e sdk/
      - name: Verify SDK imports
        run: python -c "from enal_ai import Agent, Tool, Workflow, EnalAI; print('SDK OK')"

  plugin-compatibility:
    name: Plugin Compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Verify plugin imports
        run: python -c "from backend.app.plugins import register_default_plugins; print('Plugins OK')"

  golden-tests:
    name: Golden Test Set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run golden tests
        run: python benchmarks/golden_test_set.py

  governance-check:
    name: Governance Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run governance checks
        run: python benchmarks/governance_checks.py

  pilar4-phase3-acceptance:
    name: Pilar 4 Phase 3 Acceptance Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e backend/
          pip install -e ".[dev]"
      - name: Run Pilar 4 Phase 3 acceptance tests
        run: python -m pytest tests/test_pilar4_phase3_acceptance.py -v
