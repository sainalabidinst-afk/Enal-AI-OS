[project]
name = "enal-cognitive-platform"
version = "1.0.0-dev"
description = "Enal Cognitive Platform - Adaptive Cognitive Operating System"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Enal AI OS", email = "contact@enal.ai"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.6.0",
    "aiohttp>=3.9.0",
    "asyncio>=3.4.3",
]

[project.optional-deps]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.4.0",
    "ruff>=0.4.0",
]

[project.urls]
Homepage = "https://github.com/enal-ai-org/ecp"
Documentation = "https://docs.enal.ai"
Repository = "https://github.com/enal-ai-org/ecp"

[tool.mypy]
explicit_package_bases = true
namespace_packages = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
