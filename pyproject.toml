[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enal-backend"
version = "1.0.0-developer-preview"
description = "Enal AI OS Backend — AI Operating System API"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Enal AI OS", email = "contact@enal.ai"},
]
keywords = ["ai", "api", "fastapi", "multi-agent", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.0",
    "qdrant-client>=1.7.0",
    "redis>=5.0.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.0.0",
    "litellm>=1.40.0",
    "langchain-openai>=0.1.0",
    "langchain-core>=0.1.0",
    "httpx>=0.26.0",
    "pyyaml>=6.0",
    "aiohttp>=3.9.0",
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "black>=24.4.0",
    "mypy>=1.8.0",
    "httpx2>=2.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true

[tool.pyright]
extraPaths = ["."]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingImports = "warning"
