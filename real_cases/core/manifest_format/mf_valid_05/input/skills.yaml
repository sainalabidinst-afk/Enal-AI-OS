capability_pack:
  id: "trading_analyst"
  version: "1.0.0"
  display_name: "Trading Analyst"
  description: "Capability Pack manifest for Trading Analyst"
  entry_point: "apps.trading_analyst.engine.TradingAnalystEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "trading_analyst.main"
      name: "Primary Capability"
      description: "Main capability for Trading Analyst"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "trading_analyst.parse"
    - stage: "process"
      capability: "trading_analyst.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/trading_analyst"
