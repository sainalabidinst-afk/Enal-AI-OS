capability_pack:
  id: "compliance_officer"
  version: "1.0.0"
  display_name: "Compliance Officer"
  description: "Capability Pack manifest for Compliance Officer"
  entry_point: "apps.compliance_officer.engine.ComplianceOfficerEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "compliance_officer.main"
      name: "Primary Capability"
      description: "Main capability for Compliance Officer"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "compliance_officer.parse"
    - stage: "process"
      capability: "compliance_officer.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/compliance_officer"
