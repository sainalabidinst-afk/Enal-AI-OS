capability_pack:
  id: "self_development"
  version: "1.0.0"
  display_name: "Self Development"
  description: "Capability Pack manifest for Self Development"
  entry_point: "apps.self_development.engine.SelfDevelopmentEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "self_development.main"
      name: "Primary Capability"
      description: "Main capability for Self Development"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "self_development.parse"
    - stage: "process"
      capability: "self_development.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/self_development"
