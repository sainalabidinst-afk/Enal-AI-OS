capability_pack:
  id: "observability"
  version: "1.0.0"
  display_name: "Observability"
  description: "Capability Pack manifest for Observability"
  entry_point: "apps.observability.engine.ObservabilityEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "observability.main"
      name: "Primary Capability"
      description: "Main capability for Observability"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "observability.parse"
    - stage: "process"
      capability: "observability.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/observability"
