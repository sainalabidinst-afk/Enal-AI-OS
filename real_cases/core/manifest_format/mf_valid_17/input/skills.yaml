capability_pack:
  id: "infrastructure_engineer"
  version: "1.0.0"
  display_name: "Infrastructure Engineer"
  description: "Capability Pack manifest for Infrastructure Engineer"
  entry_point: "apps.infrastructure_engineer.engine.InfrastructureEngineerEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "infrastructure_engineer.main"
      name: "Primary Capability"
      description: "Main capability for Infrastructure Engineer"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "infrastructure_engineer.parse"
    - stage: "process"
      capability: "infrastructure_engineer.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/infrastructure_engineer"
