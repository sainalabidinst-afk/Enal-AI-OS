capability_pack:
  id: "data_engineer"
  version: "1.0.0"
  display_name: "Data Engineer"
  description: "Capability Pack manifest for Data Engineer"
  entry_point: "apps.data_engineer.engine.DataEngineerEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "data_engineer.main"
      name: "Primary Capability"
      description: "Main capability for Data Engineer"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "data_engineer.parse"
    - stage: "process"
      capability: "data_engineer.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/data_engineer"
