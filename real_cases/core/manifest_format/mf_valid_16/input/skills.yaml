capability_pack:
  id: "product_manager"
  version: "1.0.0"
  display_name: "Product Manager"
  description: "Capability Pack manifest for Product Manager"
  entry_point: "apps.product_manager.engine.ProductManagerEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "product_manager.main"
      name: "Primary Capability"
      description: "Main capability for Product Manager"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "product_manager.parse"
    - stage: "process"
      capability: "product_manager.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/product_manager"
