capability_pack:
  id: "hse_specialist"
  version: "1.0.0"
  display_name: "HSE Specialist"
  description: "Capability Pack manifest for HSE Specialist"
  entry_point: "apps.hse_specialist.engine.HSESpecialistEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "hse_specialist.main"
      name: "Primary Capability"
      description: "Main capability for HSE Specialist"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "hse_specialist.parse"
    - stage: "process"
      capability: "hse_specialist.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/hse_specialist"
