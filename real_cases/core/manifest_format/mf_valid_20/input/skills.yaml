capability_pack:
  id: "cloud_architect"
  version: "1.0.0"
  display_name: "Cloud Architect"
  description: "Capability Pack manifest for Cloud Architect"
  entry_point: "apps.cloud_architect.engine.CloudArchitectEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "cloud_architect.main"
      name: "Primary Capability"
      description: "Main capability for Cloud Architect"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "cloud_architect.parse"
    - stage: "process"
      capability: "cloud_architect.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/cloud_architect"
