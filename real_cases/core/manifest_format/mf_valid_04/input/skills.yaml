capability_pack:
  id: "research_assistant"
  version: "1.0.0"
  display_name: "Research Assistant"
  description: "Capability Pack manifest for Research Assistant"
  entry_point: "apps.research_assistant.engine.ResearchAssistantEngine"
  category: "engineering"
  maturity_level: 3
  quality_target: "A+"

  capabilities:
    - id: "research_assistant.main"
      name: "Primary Capability"
      description: "Main capability for Research Assistant"
      input_schema: "TaskIntentRequest"
      output_schema: "TaskResult"

  dependencies:
    capabilities:
      - id: "execution_runtime"
        version: ">=1.0.0"
      - id: "shared_contract"
        version: ">=1.0.0"
        optional: true

  pipeline:
    - stage: "parse"
      capability: "research_assistant.parse"
    - stage: "process"
      capability: "research_assistant.process"

  metadata:
    author: "ECP Core Team"
    license: "MIT"
    repository: "https://github.com/enal-ai-os/research_assistant"
