services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: enal_ai_os
    ports:
      - "5543:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    ports:
      - "6390:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  # MinIO temporarily disabled — image not accessible in this environment
  # minio:
  #   image: minio/minio:RELEASE.2025-06-13T22-56-19Z
  #   command: server /data --console-address ":9090"
  #   ports:
  #     - "9000:9000"
  #     - "9090:9090"
  #   environment:
  #     MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
  #     MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
  #   volumes:
  #     - minio_data:/data
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
  #     interval: 15s
  #     timeout: 10s
  #     retries: 3
  #     start_period: 20s
  #   tmpfs:
  #     - /tmp
  #   security_opt:
  #     - no-new-privileges:true
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 512m
  #         cpus: '0.5'

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 22181
      ZOOKEEPER_TICK_TIME: 2000
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:22181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '1.0'

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_data:/etc/nginx/cache
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  coredns:
    image: coredns/coredns:1.11.1
    command: -conf /etc/coredns/Corefile
    ports:
      - "53:53"
      - "53:53/udp"
      - "8053:8053"
    volumes:
      - ./dns/Corefile:/etc/coredns/Corefile:ro
      - ./dns/zones:/etc/coredns/zones:ro
      - ./dns/dynamic.conf:/etc/coredns/dynamic.conf:ro
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: '0.5'

  qdrant:
    image: qdrant/qdrant:v1.9.0
    ports:
      - "6340:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "[ -d /qdrant/storage ] || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 30s
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: '0.5'

  ollama:
    image: ollama/ollama:0.1.26
    ports:
      - "11440:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "[ -d /root/.ollama ] || exit 0"]
      interval: 15s
      timeout: 10s
      retries: 2
      start_period: 30s
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: '2.0'

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/enal_ai_os
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minio123}
      MINIO_BUCKET: enal
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-gpt-4o}
      DEFAULT_REASONING_MODEL: ${DEFAULT_REASONING_MODEL:-gpt-4o}
      DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-small}
      MAX_TOKENS: ${MAX_TOKENS:-4096}
      TEMPERATURE: ${TEMPERATURE:-0.7}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_HOST: ${LANGFUSE_HOST:-http://langfuse:3000}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      LOGGING_PROVIDER: ${LOGGING_PROVIDER:-console}
      TESTING: ${TESTING:-false}
      DEBUG: ${DEBUG:-false}
      ENABLE_BENCHMARK_RUNTIME: ${ENABLE_BENCHMARK_RUNTIME:-true}
      STT_PROVIDER: ${STT_PROVIDER:-whisper}
      STT_LANGUAGE: ${STT_LANGUAGE:-id}
      STT_WHISPER_HOST: ${STT_WHISPER_HOST:-http://localhost:8082}
      TTS_PROVIDER: ${TTS_PROVIDER:-elevenlabs}
      TTS_VOICE: ${TTS_VOICE:-en}
      TTS_VOICE_NAME: ${TTS_VOICE_NAME:-Jenny-SexyBrat}
      TTS_VOICE_GENDER: ${TTS_VOICE_GENDER:-female}
      TTS_VOICE_TONE: ${TTS_VOICE_TONE:-sexy}
      TTS_VOICE_ATTITUDE: ${TTS_VOICE_ATTITUDE:-bratty}
      TTS_SPEED: ${TTS_SPEED:-0.85}
      TTS_ELEVENLABS_VOICE_ID: ${TTS_ELEVENLABS_VOICE_ID:-}
      JENNY_VOICE_PROFILE: ${JENNY_VOICE_PROFILE:-jenny}
      JENNY_TTS_VOICE_ID: ${JENNY_TTS_VOICE_ID:-2E0E83F1-1B49-4C73-9D92-A6C6E9A9A9A5}
      JENNY_LANGUAGE: ${JENNY_LANGUAGE:-id}
      TTS_PITCH: ${TTS_PITCH:-1.25}
      TTS_EMPHASIS: ${TTS_EMPHASIS:-1.4}
      TTS_PAUSE_SCALE: ${TTS_PAUSE_SCALE:-1.2}
      TTS_STYLE_EXAGGERATION: ${TTS_STYLE_EXAGGERATION:-0.85}
      TTS_STABILITY: ${TTS_STABILITY:-0.35}
      TTS_SIMILARITY_BOOST: ${TTS_SIMILARITY_BOOST:-0.85}
      LOCAL_TTS_URL: ${LOCAL_TTS_URL:-http://localhost:8083}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - backend_workspace:/app/workspace
      - ./backend:/app/backend
      - ./apps:/app/apps
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: '1.0'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      ollama:
        condition: service_healthy
      kafka:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_JENNY_TTS_VOICE_ID: ${JENNY_TTS_VOICE_ID:-2E0E83F1-1B49-4C73-9D92-A6C6E9A9A9A5}
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: '0.5'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://$(hostname):3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  ollama_data:
  minio_data:
  kafka_data:
  nginx_data:
  backend_workspace:
